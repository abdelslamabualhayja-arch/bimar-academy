<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to Bimar Academy">
  <title>Log in — Bimar Academy</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/bimar.css">
</head>

<body>

  <header class="bimar-navbar">

    <a
      href="index.html"
      class="bimar-brand"
    >

      <div class="bimar-logo-mark">

        <svg
          viewBox="0 0 48 48"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >

          <defs>

            <linearGradient
              id="bookGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >

              <stop
                offset="0%"
                stop-color="#2563EB"
              />

              <stop
                offset="100%"
                stop-color="#06B6D4"
              />

            </linearGradient>

          </defs>


          <path
            d="M5.5 10.5
               C11 9 16.5 10 21.5 13
               V39
               C16.5 36 11 35 5.5 36.5
               Z"
            fill="none"
            stroke="url(#bookGradient)"
            stroke-width="2.2"
            stroke-linejoin="round"
          />


          <path
            d="M42.5 10.5
               C37 9 31.5 10 26.5 13
               V39
               C31.5 36 37 35 42.5 36.5
               Z"
            fill="none"
            stroke="url(#bookGradient)"
            stroke-width="2.2"
            stroke-linejoin="round"
          />


          <path
            class="logo-ecg"
            d="M8 24
               H14
               L17 24
               L19 18
               L22 30
               L25 21
               L27 24
               H32
               L34 24
               L36 20
               L38 24
               H41"
            fill="none"
            stroke="#0F4CFF"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />


          <path
            d="M24 13 V39"
            stroke="#06B6D4"
            stroke-width="1.4"
            stroke-linecap="round"
            opacity="0.75"
          />

        </svg>

      </div>


      <div class="bimar-brand-text">

        <span
          class="bimar-brand-name"
          data-en="BIMAR"
          data-ar="منصة بيمار الطبية"
        >
          BIMAR
        </span>

        <span
          class="bimar-brand-sub"
          data-en="ACADEMY"
          data-ar="الأكاديمية"
        >
          ACADEMY
        </span>

      </div>

    </a>


    <nav class="bimar-nav-links">

      <a
        href="index.html"
        class="bimar-nav-link active"
        data-en="Home"
        data-ar="الرئيسية"
      >
        Home
      </a>

      <a
        href="subjects.html"
        class="bimar-nav-link"
        data-en="Subjects"
        data-ar="المواد"
      >
        Subjects
      </a>

      <a
        href="questions.html"
        class="bimar-nav-link"
        data-en="Question Bank"
        data-ar="بنك الأسئلة"
      >
        Question Bank
      </a>

      <a
        href="clinical.html"
        class="bimar-nav-link"
        data-en="Clinical"
        data-ar="السريري"
      >
        Clinical
      </a>

      <a
        href="osce.html"
        class="bimar-nav-link"
        data-en="OSCE"
        data-ar="الأوسكي"
      >
        OSCE
      </a>

    </nav>


    <div class="bimar-nav-actions">

    <div class="bimar-language">

        <button
          id="bimarEnBtn"
          class="active"
         
        >
          EN
        </button>

        <span></span>

        <button
          id="bimarArBtn"
         
        >
          AR
        </button>

      </div>


      <a
        href="login.html"
        class="bimar-login"
        data-en="Log in"
        data-ar="تسجيل الدخول"
      >
        Log in
      </a>


      <a
        href="login.html"
        class="bimar-start"
        data-en="Sign up"
        data-ar="الاشتراك"
      >
        Sign up
      </a>

    </div>


    <button
      class="bimar-menu-btn"
      id="bimarMenuBtn"
      aria-label="Open menu"
      data-aria-en="Open menu"
      data-aria-ar="فتح القائمة"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>

  </header>

  <main class="bimar-auth-page">
    <section class="bimar-auth-shell" aria-labelledby="loginTitle">
      <div class="bimar-auth-card">

        <div class="bimar-auth-brand" aria-hidden="true">
          <div class="bimar-auth-mark">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M9 10.5C9 8.57 10.57 7 12.5 7H24v34H12.5A3.5 3.5 0 0 1 9 37.5v-27Z" fill="white" opacity=".95"/>
              <path d="M39 10.5C39 8.57 37.43 7 35.5 7H24v34h11.5a3.5 3.5 0 0 0 3.5-3.5v-27Z" fill="white" opacity=".72"/>
              <path d="M25.5 28.5h3l1.7-4.5 2.2 8 2-5H37" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <h1 id="loginTitle" class="bimar-auth-heading" data-en="Welcome back" data-ar="أهلًا بعودتك">Welcome back</h1>
        <p class="bimar-auth-subtitle" data-en="Log in to continue your learning journey." data-ar="سجّل الدخول لمتابعة رحلتك التعليمية.">Log in to continue your learning journey.</p>

        <form class="bimar-auth-form" id="bimarLoginForm">
          <div class="bimar-auth-field">
            <label class="bimar-auth-label" for="loginEmail" data-en="Email address" data-ar="البريد الإلكتروني">Email address</label>
            <input class="bimar-auth-input" id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>

          <div class="bimar-auth-field">
            <label class="bimar-auth-label" for="loginPassword" data-en="Password" data-ar="كلمة المرور">Password</label>
            <input class="bimar-auth-input" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>

          <div class="bimar-auth-row">
            <label class="bimar-auth-check">
              <input type="checkbox" name="remember">
              <span data-en="Remember me" data-ar="تذكرني">Remember me</span>
            </label>
            <a href="login.html" class="bimar-auth-link" data-en="Forgot password?" data-ar="نسيت كلمة المرور؟">Forgot password?</a>
          </div>

          <button type="submit" class="bimar-auth-submit" data-en="Log in" data-ar="تسجيل الدخول">Log in</button>
        </form>

        <p class="bimar-auth-note">
          <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span>
          <a href="login.html" data-en="Sign up" data-ar="إنشاء حساب">Sign up</a>
        </p>
      </div>
    </section>
  </main>

  <script src="assets/js/bimar.js"></script>
  <script>
    document.getElementById("bimarLoginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail");
      const password = document.getElementById("loginPassword");

      if (!email.checkValidity() || !password.value.trim()) {
        this.reportValidity();
        return;
      }

      // Frontend-only demo flow until a real authentication provider is connected.
      localStorage.setItem("bimarLoggedIn", "true");
      localStorage.setItem("bimarUserEmail", email.value.trim());

      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
